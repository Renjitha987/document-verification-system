{% extends 'base.html' %}

{% block title %}My Profile - Smart Portal{% endblock %}

{% block content %}
<div class="row gy-4 justify-content-center animate-fade-in-up">
    <div class="col-lg-8">
        <div class="glass-card p-4 border d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <span class="text-secondary" style="font-size: 0.85rem;">Account Configurations</span>
                <h2 class="display-font m-0"><i class="bi bi-person-gear text-primary me-2"></i>Profile Management</h2>
            </div>
            <a href="{% url 'student_dashboard' %}" class="btn btn-outline-secondary py-2 px-3" style="border-radius: 8px; font-size: 0.9rem;">
                <i class="bi bg-transparent bi-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>
        
        <div class="glass-card p-5 border">
            <h4 class="display-font mb-4 text-primary">Profile Details</h4>
            
            <form method="POST" action="{% url 'student_profile' %}">
                {% csrf_token %}
                <div class="row g-3">
                    <!-- Read-only academic settings -->
                    <div class="col-md-6">
                        <label class="form-label text-secondary fw-semibold mb-1" style="font-size: 0.8rem;">Register Number</label>
                        <input type="text" class="form-control bg-primary border-0" value="{{ profile.register_number }}" readonly style="border-radius: 8px;">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary fw-semibold mb-1" style="font-size: 0.8rem;">College & University</label>
                        <input type="text" class="form-control bg-primary border-0" value="{{ profile.college_name }} ({{ profile.university_name }})" readonly style="border-radius: 8px;">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary fw-semibold mb-1" style="font-size: 0.8rem;">Department</label>
                        <input type="text" class="form-control bg-primary border-0" value="{{ profile.department.name }}" readonly style="border-radius: 8px;">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-secondary fw-semibold mb-1" style="font-size: 0.8rem;">Course Course</label>
                        <input type="text" class="form-control bg-primary border-0" value="{{ profile.course.name }}" readonly style="border-radius: 8px;">
                    </div>
                    
                    <hr class="my-4" style="border-color: var(--border-glass);">
                    
                    <h5 class="display-font text-primary col-12 mb-2">Editable Information</h5>
                    
                    <!-- Editable user fields -->
                    <div class="col-md-6">
                        <label for="first_name" class="form-label text-secondary fw-semibold mb-1" style="font-size: 0.8rem;">First Name</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" value="{{ user.first_name }}" required style="border-radius: 8px;">
                    </div>
                    <div class="col-md-6">
                        <label for="last_name" class="form-label text-secondary fw-semibold mb-1" style="font-size: 0.8rem;">Last Name</label>
                        <input type="text" class="form-control" id="last_name" name="last_name" value="{{ user.last_name }}" style="border-radius: 8px;">
                    </div>
                    <div class="col-md-12">
                        <label for="email" class="form-label text-secondary fw-semibold mb-1" style="font-size: 0.8rem;">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required style="border-radius: 8px;">
                    </div>
                    <div class="col-md-6">
                        <label for="father_name" class="form-label text-secondary fw-semibold mb-1" style="font-size: 0.8rem;">Father's Name</label>
                        <input type="text" class="form-control" id="father_name" name="father_name" value="{{ profile.father_name }}" required style="border-radius: 8px;">
                    </div>
                    <div class="col-md-6">
                        <label for="mother_name" class="form-label text-secondary fw-semibold mb-1" style="font-size: 0.8rem;">Mother's Name</label>
                        <input type="text" class="form-control" id="mother_name" name="mother_name" value="{{ profile.mother_name }}" required style="border-radius: 8px;">
                    </div>
                    
                    <div class="col-12 mt-4 text-end">
                        <button type="submit" class="btn btn-premium px-4">
                            <i class="bi bi-save-fill me-2"></i>Save Configurations
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
